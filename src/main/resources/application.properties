spring.application.name=crm
server.port=8080

# Database Connectivity Configuration Mapping
spring.datasource.url=jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.data.jpa.repositories.bootstrap-mode=default
spring.jpa.properties.hibernate.scanner.metadata_structures=com.example.crm.model
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
logging.level.org.springframework=INFO